[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pymzml"
version = "2.5.8"
description = "high-throughput mzML parsing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "M. Koesters" },
    { name = "J. Leufken" },
    { name = "S. Schulze" },
    { name = "K. Sugimoto" },
    { name = "R. Zahedi" },
    { name = "M. Hippler" },
    { name = "C. Fufezan", email = "christian@fufezan.net" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.8.0",
]

[project.optional-dependencies]
numpress = ["pynumpress>=0.0.4"]
deconv = ["ms_deisotope>=0.0.14"]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "numpydoc>=1.6.0",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "coverage>=7.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "coverage>=7.0",
    "ruff>=0.1.0",
    "pre-commit>=3.0",
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "numpydoc>=1.6.0",
    "pynumpress>=0.0.4",
    "ms_deisotope>=0.0.14",
    "ty>=0.0.9",
    "pyupgrade>=3.21.0",
]

[project.urls]
Homepage = "https://pymzml.github.com"
Documentation = "https://pymzml.readthedocs.io"
Repository = "https://github.com/pymzml/pymzml"
Issues = "https://github.com/pymzml/pymzml/issues"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
